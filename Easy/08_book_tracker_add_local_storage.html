<!DOCTYPE html>
<html>
<head>
  <title>Book Tracker</title>
  <style>
    /* CSS for body element - applies to everything inside body */
    body {
      font-family: Arial;
      padding: 20px;  /* Space INSIDE the body */
      background-color: #f5f5f5;
    }

    /* CSS for h1 heading */
    h1 {
      color: #2c3e50;
    }

    /* CSS for input boxes */
    input {
      padding: 10px;  /* Space INSIDE the input box */
      font-size: 16px;
      width: 300px;
      margin-right: 10px;
      margin-bottom: 10px;
    }

    /* CSS for ALL button elements - applies to every button */
    button {
      background-color: #27ae60;  /* Default green color */
      color: white;
      padding: 10px 20px;  /* 10px top/bottom, 20px left/right */
      font-size: 16px;
      border: none;  /* No border */
      border-radius: 5px;  /* Rounded corners */
      cursor: pointer;  /* Cursor becomes hand on hover */
    }

    /* ID selector (#) - targets ONE specific element with id="bookList" */
    #bookList {
      margin-top: 20px;  /* Space OUTSIDE above */
      margin-bottom: 20px;  /* Space OUTSIDE below */
    }

    /* CLASS selector (.) - targets ALL elements with class="bookItem" */
    .bookItem {
      background-color: white;
      padding: 20px;  /* Space INSIDE each book card */
      gap: 20px;  /* Space BETWEEN flex items (text and buttons) */
      margin: 10px 0;  /* Space OUTSIDE between different book cards */
      display: flex;  /* Arranges items side-by-side (not stacked) */
      justify-content: space-between;  /* Pushes items to opposite ends */
      align-items: center;  /* Vertically centers items on same line */
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>My Books</h1>
  
  <!-- Input box where user types book name -->
  <input type="text" id="bookInput" placeholder="Enter book name">
  
  <!-- Input box where user types author name -->
  <input type="text" id="authorInput" placeholder="Enter author name">
  
  <input type="number" id="ratingInput" placeholder="Rating (1-5)" min="1" max="5">
  <!-- Add Book button -->
  <button id="addBtn">Add Book</button>
  
  <!-- Container where all books will be added dynamically -->
  <div id="bookList">
  </div>

  <script>
    /* Get references to HTML elements by their IDs */
    const button = document.getElementById("addBtn");
    const input = document.getElementById("bookInput");
    const authorInput = document.getElementById("authorInput");
    const bookList = document.getElementById("bookList");
    
    function saveBookToLocalStorage(bookName, authorName, rating) {
        // get list of book if already existing if not return []
        let books = JSON.parse(localStorage.getItem("books")) || [];
        // Add a new book
        books.push({
            bookName,
            authorName,
            rating
        });

        localStorage.setItem("books", JSON.stringify(books));

    }

    function loadBooksFromLocalStorage() {
        let books = JSON.parse(localStorage.getItem("books")) || [];
        books.forEach(function(book){
            displayBook(book.bookName, book.authorName, book.rating);
        });
    }

    function displayBook(bookName, authorName, bookRating) {
        const bookItem = document.createElement("div");
        bookItem.className = "bookItem";

        const bookText = document.createElement("span");
        bookText.textContent = bookName + " by " + authorName + " [Rating: " + bookRating + "/5]";

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Delete";
        deleteBtn.style.backgroundColor = "#e74c3c";

        const updateBtn = document.createElement("button");
        updateBtn.textContent = "Update";
        updateBtn.style.backgroundColor = "#3498db";

        bookItem.appendChild(bookText);
        bookItem.appendChild(updateBtn);
        bookItem.appendChild(deleteBtn);

        bookList.appendChild(bookItem);

        deleteBtn.addEventListener("click", function() {
            bookItem.remove();
            deleteBookFromLocalStorage(bookName);
        });

        updateBtn.addEventListener("click", function(){
            const editInput = document.createElement("input");
            editInput.type = "text";
            editInput.value = bookText.textContent;

            bookItem.replaceChild(editInput, bookText);
            editInput.focus();

            editInput.addEventListener("keypress", function(event){
            if (event.key == "Enter") {
                bookText.textContent = editInput.value;
                bookItem.replaceChild(bookText, editInput);
            }
            });
        });
    }

    /* Function to delete a book from local storage */
    function deleteBookFromLocalStorage(bookNameToDelete) {
        /* Get all books from local storage */
        let books = JSON.parse(localStorage.getItem("books")) || [];
        
        /* Keep only books that DON'T match the deleted one */
        books = books.filter(function(book) {
            return book.bookName !== bookNameToDelete;
        });
        
        /* Save the updated list back to local storage */
        localStorage.setItem("books", JSON.stringify(books));
    }

    /* When user clicks "Add Book" button, run this function */
    button.addEventListener("click", function() {
      /* Get the text user typed in the input boxes */
      const bookName = input.value;
      const authorName = authorInput.value;
      const rating = document.getElementById("ratingInput").value;

      displayBook(bookName, authorName, rating);
      saveBookToLocalStorage(bookName, authorName, rating);

      /* Clear both input boxes so user can add another book */
      input.value = "";
      authorInput.value = "";
      document.getElementById("ratingInput").value = "";
    });
    loadBooksFromLocalStorage();
  </script>
</body>
</html>
