<!DOCTYPE html>
<html>
<head>
  <title>Book Tracker</title>
  <style>
    /* CSS for body element - applies to everything inside body */
    body {
      font-family: Arial;
      padding: 20px;  /* Space INSIDE the body */
      background-color: #f5f5f5;
    }

    /* CSS for h1 heading */
    h1 {
      color: #2c3e50;
    }

    /* CSS for input boxes */
    input {
      padding: 10px;  /* Space INSIDE the input box */
      font-size: 16px;
      width: 300px;
      margin-right: 10px;
      margin-bottom: 10px;
    }

    /* CSS for ALL button elements - applies to every button */
    button {
      background-color: #27ae60;  /* Default green color */
      color: white;
      padding: 10px 20px;  /* 10px top/bottom, 20px left/right */
      font-size: 16px;
      border: none;  /* No border */
      border-radius: 5px;  /* Rounded corners */
      cursor: pointer;  /* Cursor becomes hand on hover */
    }

    /* ID selector (#) - targets ONE specific element with id="bookList" */
    #bookList {
      margin-top: 20px;  /* Space OUTSIDE above */
      margin-bottom: 20px;  /* Space OUTSIDE below */
    }

    /* CLASS selector (.) - targets ALL elements with class="bookItem" */
    .bookItem {
        background-color: white;
        padding: 20px;
        gap: 10px;
        margin: 20px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-radius: 20px;
        
        /* ADD THESE: */
        box-shadow: 0 10px 6px rgba(0, 0, 0, 0.2);  /* Subtle shadow */
        border-left: 4px solid #3498db;             /* Blue accent bar */
        transition: all 2.3s ease;                  /* Smooth transitions */
    }

    .bookItem:hover {
        background-color: #f0f0f0;      /* Light gray background */
        box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);  /* Bigger shadow */
        transform: translateY(-5px);    /* Move up 5px */
        border-left-color: #e74c3c;     /* Red bar on hover */
    }
  </style>
</head>
<body>
  <h1>My Books</h1>
  
  <!-- Input box where user types book name -->
  <input type="text" id="bookInput" placeholder="Enter book name">
  
  <!-- Input box where user types author name -->
  <input type="text" id="authorInput" placeholder="Enter author name">
  
  <input type="number" id="ratingInput" placeholder="Rating (1-5)" min="1" max="5">
  <!-- Add Book button -->
  <button id="addBtn">Add Book</button>
  <input type="text" id="searchInput" placeholder="Search books by name">
  
  <!-- Container where all books will be added dynamically -->
  <div id="bookList">
  </div>

  <script>
    // 1) Store the key page elements in variables.
    // This keeps the code clean and makes later actions easier to follow.
    const button = document.getElementById("addBtn");
    const input = document.getElementById("bookInput");
    const authorInput = document.getElementById("authorInput");
    const bookList = document.getElementById("bookList");

    // 2) Filter the list based on user input.
    // We hide books that do not match the search term.
    function searchBooks(searchTerm) {
      const allBooks = document.querySelectorAll(".bookItem");

      allBooks.forEach(function(bookElement) {
        const bookText = bookElement.textContent.toLowerCase();
        const searchLower = searchTerm.toLowerCase();

        if (bookText.includes(searchLower)) {
          bookElement.style.display = "flex";
        } else {
          bookElement.style.display = "none";
        }
      });
    }

    // 3) The search box listens for every key release.
    // This makes the filter work live while the user types.
    const searchInput = document.getElementById("searchInput");
    searchInput.addEventListener("keyup", function() {
      const searchTerm = searchInput.value;
      searchBooks(searchTerm);
    });

    // 4) Save a new book object into browser storage.
    // localStorage only stores strings, so we convert data with JSON.stringify.
    function saveBookToLocalStorage(bookName, authorName, rating) {
      let books = JSON.parse(localStorage.getItem("books")) || [];

      books.push({
        bookName,
        authorName,
        rating
      });

      localStorage.setItem("books", JSON.stringify(books));
    }

    // 5) When the page loads, restore all saved books.
    function loadBooksFromLocalStorage() {
      let books = JSON.parse(localStorage.getItem("books")) || [];
      books.forEach(function(book) {
        displayBook(book.bookName, book.authorName, book.rating);
      });
    }

    // 6) Update an already saved book name.
    function updateBookInLocalStorage(oldBookName, newBookName) {
      let books = JSON.parse(localStorage.getItem("books")) || [];

      books = books.map(function(book) {
        if (book.bookName === oldBookName) {
          return {
            bookName: newBookName,
            authorName: book.authorName,
            rating: book.rating
          };
        }
        return book;
      });

      localStorage.setItem("books", JSON.stringify(books));
    }

    // 7) Build the actual book card that appears on the page.
    // Each card contains the text plus update/delete actions.
    function displayBook(bookName, authorName, bookRating) {
      const bookItem = document.createElement("div");
      bookItem.className = "bookItem";

      const bookText = document.createElement("span");
      bookText.textContent = bookName + " by " + authorName + " [Rating: " + bookRating + "/5]";

      const deleteBtn = document.createElement("button");
      deleteBtn.textContent = "Delete";
      deleteBtn.style.backgroundColor = "#e74c3c";

      const updateBtn = document.createElement("button");
      updateBtn.textContent = "Update";
      updateBtn.style.backgroundColor = "#3498db";

      bookItem.appendChild(bookText);
      bookItem.appendChild(updateBtn);
      bookItem.appendChild(deleteBtn);

      bookList.appendChild(bookItem);

      // Delete the card from the page and from browser storage.
      deleteBtn.addEventListener("click", function() {
        bookItem.remove();
        deleteBookFromLocalStorage(bookName);
      });

      // Update the text using an inline edit input.
      updateBtn.addEventListener("click", function() {
        const editInput = document.createElement("input");
        editInput.type = "text";
        editInput.value = bookText.textContent;

        bookItem.replaceChild(editInput, bookText);
        editInput.focus();

        editInput.addEventListener("keypress", function(event) {
          if (event.key == "Enter") {
            bookText.textContent = editInput.value;
            bookItem.replaceChild(bookText, editInput);

            const newBookName = editInput.value.split(" by ")[0];
            updateBookInLocalStorage(bookName, newBookName);
          }
        });
      });
    }

    // Remove a book from localStorage by filtering it out.
    function deleteBookFromLocalStorage(bookNameToDelete) {
      let books = JSON.parse(localStorage.getItem("books")) || [];

      books = books.filter(function(book) {
        return book.bookName !== bookNameToDelete;
      });

      localStorage.setItem("books", JSON.stringify(books));
    }

    // Add a new book to the app when the button is clicked.
    button.addEventListener("click", function() {
      const bookName = input.value;
      const authorName = authorInput.value;
      const rating = document.getElementById("ratingInput").value;

      displayBook(bookName, authorName, rating);
      saveBookToLocalStorage(bookName, authorName, rating);

      // Clear the inputs after adding so the form is ready for the next entry.
      input.value = "";
      authorInput.value = "";
      document.getElementById("ratingInput").value = "";
    });

    // Load any saved books when the page is opened.
    loadBooksFromLocalStorage();
  </script>
</body>
</html>
